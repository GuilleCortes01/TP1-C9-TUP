<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
      <title>Iniciar sesión - MiProfe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <header>
    <div class="logo">
      <a href="index.html"><h1>MiProfe</h1></a>
    </div>
    <nav>
      <ul>
        <li><a href="Register.html">Registrarme</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="login">
      <h2>Iniciar sesión</h2>

      <form action="#" method="post">
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="ana@email.com" required>
        </div>

        <div>
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit">Ingresar</button>
      </form>

      <p>¿No tenés cuenta? <a href="Register.html">Registrate acá</a></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 MiProfe. Todos los derechos reservados.</p>
  </footer>
</body>
</html>
