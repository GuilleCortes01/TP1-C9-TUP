<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
     <title>Crear cuenta - MiProfe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
     <header>
    <div class="logo">
      <a href="index.html"><h1>MiProfe</h1></a>
    </div>
    <nav>
      <ul>
        <li><a href="Login.html">Iniciar sesión</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="register">
      <h2>Crear cuenta</h2>

      <form action="#" method="post">

        <fieldset>
          <legend>Quiero registrarme como</legend>
          <label>
            <input type="radio" name="rol" value="alumno" checked>
            Alumno
          </label>
          <label>
            <input type="radio" name="rol" value="profesor">
            Profesor
          </label>
        </fieldset>

        <div>
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ana Gómez" required>
        </div>

        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="ana@email.com" required>
        </div>

        <div>
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <fieldset>
          <legend>Datos como profesor (opcional si te registrás como alumno)</legend>
          <div>
            <label for="materia">Materia que enseñás</label>
            <input type="text" id="materia" name="materia" placeholder="Matemática">
          </div>
        </fieldset>

        <button type="submit">Crear cuenta</button>
      </form>

      <p>¿Ya tenés cuenta? <a href="Login.html">Iniciar sesión</a></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 MiProfe. Todos los derechos reservados.</p>
  </footer>
</body>
</html>
