<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Crear cuenta - MiProfe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="Estilo/style.css">
  <style>
    /* Estilos globales y de centrado */
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Formulario Uiverse.io */
    .form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 450px;
      max-width: 450px;
      background-color: #cce4f8;
      padding: 20px;
      position: relative;
      align-items: center;
    }

    .title {
      font-size: 28px;
      color: royalblue;
      font-weight: 600;
      letter-spacing: -1px;
      position: relative;
      display: flex;
      align-items: center;
      padding-left: 30px;
      margin: 0;
    }

    .title::before, .title::after {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      border-radius: 50%;
      left: 0px;
      background-color: royalblue;
    }

    .title::before {
      width: 18px;
      height: 18px;
      background-color: royalblue;
    }

    .title::after {
      width: 18px;
      height: 18px;
      animation: pulse 1s linear infinite;
    }

    .message, .signin {
      color: rgba(88, 87, 87, 0.822);
      font-size: 14px;
      margin: 0;
    }

    .signin {
      text-align: center;
      margin-top: 10px;
    }

    .signin a {
      color: royalblue;
    }

    .signin a:hover {
      text-decoration: underline royalblue;
    }

    /* Entradas e Inputs */
    .form label {
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .form label .input {
      width: 100%;
      padding: 10px 10px 20px 10px;
      outline: 0;
      border: 1px solid rgba(105, 105, 105, 0.397);
      border-radius: 10px;
      box-sizing: border-box;
    }

    .form label .input + span {
      position: absolute;
      left: 10px;
      top: 15px;
      color: grey;
      font-size: 0.9em;
      cursor: text;
      transition: 0.3s ease;
      pointer-events: none;
    }

    .form label .input:placeholder-shown + span {
      top: 15px;
      font-size: 0.9em;
    }

    .form label .input:focus + span, .form label .input:valid + span {
      top: 30px;
      font-size: 0.7em;
      font-weight: 600;
    }

    .form label .input:valid + span {
      color: green;
    }

    .submit {
      border: none;
      outline: none;
      background-color: royalblue;
      padding: 10px;
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: .3s ease;
    }

    .submit:hover {
      background-color: rgb(56, 90, 194);
    }

    @keyframes pulse {
      from {
        transform: scale(0.9);
        opacity: 1;
      }
      to {
        transform: scale(1.8);
        opacity: 0;
      }
    }

    /* Selección de Rol */
    .role-container {
      border: 1px solid rgba(105, 105, 105, 0.397);
      border-radius: 10px;
      padding: 8px 12px;
      margin: 0;
    }

    .role-container legend {
      font-size: 0.8em;
      color: grey;
      padding: 0 4px;
    }

    .radio-options {
      display: flex;
      gap: 15px;
      margin-top: 4px;
    }

    .radio-option {
      display: flex !important;
      flex-direction: row !important;
      align-items: center;
      gap: 5px;
      font-size: 0.9em;
      color: #333;
      cursor: pointer;
    }

    .radio-option input[type="radio"] {
      accent-color: royalblue;
    }
  </style>
</head>
<body>
  <header>
   <nav class="navbar">

    <a href="index.html" class="logo">
      <img src="./img/Logo_Principal.png" alt="">
      MiProfe
    </a>

    <!-- Botón hamburguesa -->
    <input type="checkbox" id="menu-toggle">

    <label for="menu-toggle" class="menu__button">
      <span></span>
      <span></span>
    </label>

    <!-- Menú -->
    <ul class="nav-links">
      <li>
        <a href="Login.html" class="nav-login">
          Iniciar sesión
        </a>
      </li>
    </ul>

  </nav>
  </header>

  <main class="Principal-Registro">
    <section id="register">
      <form class="form" action="#" method="post">
        <p class="title">Crear cuenta</p>
        <p class="message">Registrate para comenzar en MiProfe.</p>

        <!-- Selección de Rol -->
        <fieldset class="role-container">
          <legend>Quiero registrarme como</legend>
          <div class="radio-options">
            <label class="radio-option">
              <input type="radio" name="rol" value="alumno" checked>
              Alumno
            </label>
            <label class="radio-option">
              <input type="radio" name="rol" value="profesor">
              Profesor
            </label>
          </div>
        </fieldset>

        <!-- Campo Nombre completo -->
        <label>
          <input required="" placeholder="" type="text" id="nombre" name="nombre" class="input">
          <span>Nombre completo</span>
        </label>

        <!-- Campo Email -->
        <label>
          <input required="" placeholder="" type="email" id="email" name="email" class="input">
          <span>Email</span>
        </label>

        <!-- Campo Contraseña -->
        <label>
          <input required="" placeholder="" type="password" id="password" name="password" class="input">
          <span>Contraseña</span>
        </label>

        <!-- Campo Materia (Opcional) -->
        <label>
          <input placeholder="" type="text" id="materia" name="materia" class="input">
          <span>Materia que enseñás (opcional)</span>
        </label>

        <button type="submit" class="submit">Crear cuenta</button>
        <p class="signin">¿Ya tenés cuenta? <a href="Login.html">Iniciar sesión</a></p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 MiProfe. Todos los derechos reservados.</p>
  </footer>
</body>
</html>
