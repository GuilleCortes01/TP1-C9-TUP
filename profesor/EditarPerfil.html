  <main class="Principal-inicio">
    <div class="inicio-contenido">

    <section id="editar-perfil">
      <h2>Editar mi perfil</h2>

      <form action="#" method="post" class="card mi-card-accent">
        <div class="card-body">

        <div class="mb-4 d-flex align-items-center gap-3">
          <div class="avatar avatar--grande flex-shrink-0" id="avatarPreview" aria-hidden="true">AG</div>
          <div>
            <label for="foto" class="form-label">Foto de perfil</label>
            <input type="file" id="foto" name="foto" class="form-control" accept="image/*">
          </div>
        </div>

        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" class="form-control" value="Ana Giménez" required>
        </div>

        <div class="mb-3">
          <label for="materia" class="form-label">Materia</label>
          <input type="text" id="materia" name="materia" class="form-control" value="Matemática" required>
        </div>

        <div class="mb-3">
          <label for="nivel" class="form-label">Nivel educativo</label>
          <select id="nivel" name="nivel" class="form-select" required>
            <option value="">Seleccioná un nivel</option>
            <option value="primario">Primario</option>
            <option value="secundario" selected>Secundario</option>
            <option value="universitario">Universitario</option>
            <option value="adultos">Adultos</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="descripcion" class="form-label">Sobre mí</label>
          <textarea id="descripcion" name="descripcion" class="form-control" placeholder="Contales a los alumnos sobre tu experiencia y metodología">Profesora de Matemática con 8 años de experiencia preparando alumnos de secundario y primer año de facultad.</textarea>
        </div>

        <div class="mb-3">
          <label for="precio" class="form-label">Precio por hora</label>
          <input type="number" id="precio" name="precio" class="form-control" value="4500" required>
        </div>

        <fieldset class="mb-3">
          <legend class="form-label">Modalidad</legend>
          <div class="d-flex gap-4">

            <div class="form-check">
              <input type="checkbox" id="modalidad-virtual" name="modalidad" value="virtual" class="form-check-input" checked>
              <label for="modalidad-virtual" class="form-check-label">Virtual</label>
            </div>

            <div class="form-check">
              <input type="checkbox" id="modalidad-presencial" name="modalidad" value="presencial" class="form-check-input" checked>
              <label for="modalidad-presencial" class="form-check-label">Presencial</label>
            </div>

          </div>
        </fieldset>

        <div class="mb-3">
          <label for="ubicacion" class="form-label">Ubicación</label>
          <input type="text" id="ubicacion" name="ubicacion" class="form-control" value="San Miguel de Tucumán">
        </div>

        <div class="mb-3">
          <label for="horarios" class="form-label">Horarios disponibles</label>
          <input type="text" id="horarios" name="horarios" class="form-control" value="Lunes a viernes de 16 a 20hs">
        </div>

        <div class="d-flex align-items-center gap-3">
          <button type="submit" class="btn btn-primary">Guardar cambios</button>
          <a href="PrincipalProfesor.html" class="btn btn-outline-secondary">Cancelar</a>
        </div>

        </div>
      </form>
    </section>

    </div>
