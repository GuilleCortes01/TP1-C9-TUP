<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="../Estilo/style.css">
  <link rel="stylesheet" href="../Estilo/styleAlumnos.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="../img/Logo_Principal.png">
  <title>Editar perfil - MiProfe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg mi-navbar">
      <div class="container-fluid">

        <a href="principalAlumno.html" class="navbar-brand mi-logo">
          <img src="../img/Logo_Principal.png" alt="" width="44" height="44">
          MiProfe
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navAlumno" aria-controls="navAlumno" aria-expanded="false" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navAlumno">
          <ul class="navbar-nav ms-lg-auto align-items-lg-center gap-lg-2 mt-3 mt-lg-0">
            <li class="nav-item"><a class="nav-link" href="principalAlumno.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="MisProfesores.html">Mis profesores</a></li>
            <li class="nav-item"><a class="nav-link" href="grupos.html">Grupos</a></li>
            <li class="nav-item"><a class="nav-link" href="chatGrupo.html">Chat</a></li>
            <li class="nav-item"><a class="btn mi-btn-cerrar-sesion mt-2 mt-lg-0" href="../index.html">Cerrar sesión</a></li>
          </ul>
        </div>

      </div>
    </nav>
  </header>

  <main class="Principal-inicio">
    <div class="inicio-contenido">

    <section id="editar-perfil">
      <h2>Editar mi perfil</h2>

      <form action="#" method="post" class="card">
        <div class="card-body">

        <div class="mb-4 d-flex align-items-center gap-3">
          <div class="avatar avatar--grande flex-shrink-0" id="avatarPreview" aria-hidden="true">JP</div>
          <div>
            <label for="foto" class="form-label">Foto de perfil</label>
            <input type="file" id="foto" name="foto" class="form-control" accept="image/*">
          </div>
        </div>

        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" class="form-control" value="Juan Pérez" required>
        </div>

        <div class="mb-3">
          <label for="nivel" class="form-label">Nivel educativo</label>
          <select id="nivel" name="nivel" class="form-select" required>
            <option value="">Seleccioná un nivel</option>
            <option value="primario">Primario</option>
            <option value="secundario" selected>Secundario</option>
            <option value="universitario">Universitario</option>
            <option value="adultos">Adultos</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="descripcion" class="form-label">Sobre mí</label>
          <textarea id="descripcion" name="descripcion" class="form-control" placeholder="Contale al profesor qué estás buscando aprender">Alumno de secundario buscando reforzar Matemática y Física.</textarea>
        </div>

        <fieldset class="mb-3">
          <legend class="form-label">Materias de interés</legend>
          <div class="d-flex flex-wrap gap-4">

            <div class="form-check">
              <input type="checkbox" id="materia-matematica" name="materias" value="matematica" class="form-check-input" checked>
              <label for="materia-matematica" class="form-check-label">Matemática</label>
            </div>

            <div class="form-check">
              <input type="checkbox" id="materia-fisica" name="materias" value="fisica" class="form-check-input" checked>
              <label for="materia-fisica" class="form-check-label">Física</label>
            </div>

            <div class="form-check">
              <input type="checkbox" id="materia-ingles" name="materias" value="ingles" class="form-check-input">
              <label for="materia-ingles" class="form-check-label">Inglés</label>
            </div>

          </div>
        </fieldset>

        <div class="mb-3">
          <label for="ubicacion" class="form-label">Ubicación</label>
          <input type="text" id="ubicacion" name="ubicacion" class="form-control" value="San Miguel de Tucumán">
        </div>

        <div class="d-flex align-items-center gap-3">
          <button type="submit" class="btn btn-primary">Guardar cambios</button>
          <a href="principalAlumno.html" class="btn btn-outline-secondary">Cancelar</a>
        </div>

        </div>
      </form>
    </section>

    </div>
  </main>

  <footer>
    <p>&copy; 2026 MiProfe. Todos los derechos reservados.</p>
  </footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script>
  document.getElementById('foto').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      document.getElementById('avatarPreview').innerHTML = `<img src="${reader.result}" alt="">`;
    };
    reader.readAsDataURL(file);
  });
</script>
</body>
</html>
